<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>JRMS Listening Catalog</title><style>:root{color-scheme:dark}body{font-family:system-ui,sans-serif;max-width:1120px;margin:28px auto;padding:0 18px;background:#111;color:#eee;line-height:1.5}a{color:#9cf}button{font:inherit;cursor:pointer}.nav{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}.nav a{padding:7px 10px;border:1px solid #444;text-decoration:none}.summary{color:#aaa;max-width:850px}.hero{border-top:1px solid #333;border-bottom:1px solid #333;padding:18px 0;margin:18px 0}.catalog img{max-width:100%;height:auto}.machine{margin:30px 0}.machine h2{margin-bottom:8px}.machine ul{list-style:none;padding:0;margin:0}.machine li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #222}.piece{min-width:240px}.links{display:flex;gap:8px}#player{position:sticky;bottom:0;width:100%;margin-top:24px;background:#111;padding:8px 0}@media(max-width:650px){.piece{min-width:0;width:100%}}</style></head><body>
<h1>JRMS Listening Catalog</h1><p class='summary'>48 kHz deterministic DSP listening reference. This page is for browsing and comparing individual pieces. Pattern playback has been moved to its own page.</p>
<nav class='nav'><a href='sequencer.html'>Open 16-step Sequencer</a><a href='https://github.com/hugelton/JapaneseRhythmMachineSimCatalog'>Catalog repository</a></nav>
<div class='hero'><button type='button' onclick="playPreview('all_pieces.wav')">Play all pieces (~1 min)</button> <a href='all_pieces.wav'>WAV</a> <a href='all_pieces.png'>Waveform PNG</a> <a href='all_pieces.mp4'>MP4</a></div>
<p class='catalog'><img src='all_pieces.png' alt='All pieces waveform'></p>
<div id='catalog'></div><audio id='player' controls></audio><script src='catalog-data.js'></script><script>
const player=document.getElementById('player');function playPreview(src){player.src=src;player.currentTime=0;player.play();}
const root=document.getElementById('catalog');let current='';let section=null;let list=null;
for(const p of pieces){const split=p.label.indexOf(' / ');const machine=split>=0?p.label.slice(0,split):'Other';const piece=split>=0?p.label.slice(split+3):p.label;if(machine!==current){current=machine;section=document.createElement('section');section.className='machine';const h=document.createElement('h2');h.textContent=machine;section.appendChild(h);list=document.createElement('ul');section.appendChild(list);root.appendChild(section);}const li=document.createElement('li');const name=document.createElement('strong');name.className='piece';name.textContent=piece;li.appendChild(name);const play=document.createElement('button');play.type='button';play.textContent='Play';play.onclick=()=>playPreview(p.wav);li.appendChild(play);const wav=document.createElement('a');wav.href=p.wav;wav.textContent='WAV';li.appendChild(wav);const png=document.createElement('a');png.href=p.wav.replace(/\.wav$/i,'.png');png.textContent='PNG';li.appendChild(png);list.appendChild(li);}
</script></body></html>
