<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>JRMS 16-step Sequencer</title><style>:root{color-scheme:dark}body{font-family:system-ui,sans-serif;max-width:1120px;margin:28px auto;padding:0 18px;background:#111;color:#eee}a{color:#9cf}button,select,input{font:inherit}.nav{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}.nav a{padding:7px 10px;border:1px solid #444;text-decoration:none}.transport{display:flex;gap:8px;align-items:center;margin:14px 0}.seq{overflow-x:auto;border:1px solid #333;padding:10px}.row{display:grid;grid-template-columns:230px repeat(16,32px);gap:4px;align-items:center;margin:4px 0}.row select{width:225px;background:#222;color:#eee;border:1px solid #444}.step{width:32px;height:28px;border:1px solid #444;background:#222;color:#777;padding:0}.step.on{background:#ddd;color:#111}.step.playhead{outline:2px solid #f90}.head{font-size:11px;color:#888}</style></head><body>
<h1>JRMS 16 Track / 16 Step Sequencer</h1><p>Mono, fixed level. Each track can select any rendered JRMS Piece.</p>
<nav class='nav'><a href='index.html'>Back to listening catalog</a></nav>
<div class='transport'><button id='seqPlay'>Play</button><button id='seqStop'>Stop</button><label>BPM <input id='bpm' type='number' min='40' max='300' value='120' style='width:70px'></label></div><div class='seq'><div class='row head'><span>Piece</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span><span>16</span></div><div id='sequencer'></div></div><script>
const pieces=[{label:'KP-77 / Bass Drum',wav:'audio/piece_001.wav'},{label:'KP-77 / Snare Drum',wav:'audio/piece_002.wav'},{label:'KP-77 / Tom',wav:'audio/piece_003.wav'},{label:'KP-77 / Clap',wav:'audio/piece_004.wav'},{label:'KP-77 / Closed Hi-Hat',wav:'audio/piece_005.wav'},{label:'KP-77 / Open Hi-Hat',wav:'audio/piece_006.wav'},{label:'KP-77 / Cymbal',wav:'audio/piece_007.wav'},{label:'KP-77 / Claves',wav:'audio/piece_008.wav'},{label:'KD-55 / Bass Drum',wav:'audio/piece_009.wav'},{label:'KD-55 / Snare Drum',wav:'audio/piece_010.wav'},{label:'KD-55 / Rimshot',wav:'audio/piece_011.wav'},{label:'KD-55 / Claves',wav:'audio/piece_012.wav'},{label:'KD-55 / Cowbell',wav:'audio/piece_013.wav'},{label:'KD-55 / Low Conga',wav:'audio/piece_014.wav'},{label:'KD-55 / High Conga',wav:'audio/piece_015.wav'},{label:'KD-55 / Low Tom',wav:'audio/piece_016.wav'},{label:'KD-55 / High Tom',wav:'audio/piece_017.wav'},{label:'KD-55 / Cymbal',wav:'audio/piece_018.wav'},{label:'KD-55 / Closed Hi-Hat',wav:'audio/piece_019.wav'},{label:'KD-55 / Open Hi-Hat',wav:'audio/piece_020.wav'},{label:'TD-66 / Bass Drum',wav:'audio/piece_021.wav'},{label:'TD-66 / Rim Shot',wav:'audio/piece_022.wav'},{label:'TD-66 / Snare Drum',wav:'audio/piece_023.wav'},{label:'TD-66 / Closed Hi-Hat',wav:'audio/piece_024.wav'},{label:'TD-66 / Open Hi-Hat extension',wav:'audio/piece_025.wav'},{label:'TD-66 / Cymbal',wav:'audio/piece_026.wav'},{label:'TD-66 / High Bongo',wav:'audio/piece_027.wav'},{label:'TD-66 / Low Bongo',wav:'audio/piece_028.wav'},{label:'TD-66 / Low Conga extension',wav:'audio/piece_029.wav'},{label:'TD-66 / High Conga',wav:'audio/piece_030.wav'},{label:'TD-66 / Cow Bell',wav:'audio/piece_031.wav'},{label:'TD-66 / Claves',wav:'audio/piece_032.wav'},{label:'TD-80 / Bass Drum',wav:'audio/piece_033.wav'},{label:'TD-80 / Snare Drum',wav:'audio/piece_034.wav'},{label:'TD-80 / Low Conga',wav:'audio/piece_035.wav'},{label:'TD-80 / Low Tom',wav:'audio/piece_036.wav'},{label:'TD-80 / Mid Conga',wav:'audio/piece_037.wav'},{label:'TD-80 / Mid Tom',wav:'audio/piece_038.wav'},{label:'TD-80 / High Conga',wav:'audio/piece_039.wav'},{label:'TD-80 / High Tom',wav:'audio/piece_040.wav'},{label:'TD-80 / Claves',wav:'audio/piece_041.wav'},{label:'TD-80 / Rim Shot',wav:'audio/piece_042.wav'},{label:'TD-80 / Maracas',wav:'audio/piece_043.wav'},{label:'TD-80 / Hand Clap',wav:'audio/piece_044.wav'},{label:'TD-80 / Cow Bell',wav:'audio/piece_045.wav'},{label:'TD-80 / Cymbal',wav:'audio/piece_046.wav'},{label:'TD-80 / Open Hi Hat',wav:'audio/piece_047.wav'},{label:'TD-80 / Closed Hi Hat',wav:'audio/piece_048.wav'},{label:'TD-90 / Bass Drum',wav:'audio/piece_049.wav'},{label:'TD-90 / Snare Drum',wav:'audio/piece_050.wav'},{label:'TD-90 / Low Tom',wav:'audio/piece_051.wav'},{label:'TD-90 / Mid Tom',wav:'audio/piece_052.wav'},{label:'TD-90 / High Tom',wav:'audio/piece_053.wav'},{label:'TD-90 / Rim Shot',wav:'audio/piece_054.wav'},{label:'TD-90 / Hand Clap',wav:'audio/piece_055.wav'},{label:'BR-55 / Bass Drum',wav:'audio/piece_056.wav'},{label:'BR-55 / Snare Drum',wav:'audio/piece_057.wav'},{label:'BR-55 / Rim Shot',wav:'audio/piece_058.wav'},{label:'BR-55 / Hi Hat',wav:'audio/piece_059.wav'},{label:'BR-110 / Bass Drum',wav:'audio/piece_060.wav'},{label:'BR-110 / Snare Drum',wav:'audio/piece_061.wav'},{label:'BR-110 / Cymbal',wav:'audio/piece_062.wav'},{label:'BR-110 / Closed Hi-Hat',wav:'audio/piece_063.wav'},{label:'BR-110 / Open Hi-Hat',wav:'audio/piece_064.wav'},{label:'BR-110 / Hand Clap',wav:'audio/piece_065.wav'},{label:'RM-10 / Bass Drum',wav:'audio/piece_066.wav'},{label:'RM-10 / Snare Drum',wav:'audio/piece_067.wav'},{label:'HX-2 / Hand Clap',wav:'audio/piece_068.wav'},{label:'PX-2 / Percussion Synthesizer',wav:'audio/piece_069.wav'},{label:'BX-1 / Percussion Synthesizer',wav:'audio/piece_070.wav'},{label:'BX-2 / Percussion Synthesizer + Noise',wav:'audio/piece_071.wav'},{label:'SX-1 / Voice Board',wav:'audio/piece_072.wav'},{label:'TX-305 / Bass Drum channel',wav:'audio/piece_073.wav'},{label:'TX-305 / Snare Drum channel',wav:'audio/piece_074.wav'},{label:'TX-305 / Tom channel',wav:'audio/piece_075.wav'},{label:'TX-305 / Rimshot channel',wav:'audio/piece_076.wav'},{label:'TX-306 / Hand Clap channel',wav:'audio/piece_077.wav'},{label:'TX-306 / Synth channel',wav:'audio/piece_078.wav'},{label:'DRX-5 / Bass Drum',wav:'audio/piece_079.wav'},{label:'DRX-5 / Snare Drum',wav:'audio/piece_080.wav'},{label:'DRX-5 / Tom 1',wav:'audio/piece_081.wav'},{label:'DRX-5 / Tom 2',wav:'audio/piece_082.wav'},{label:'DRX-5 / Tom 3',wav:'audio/piece_083.wav'},{label:'EK-70 / Big Taiko',wav:'audio/piece_084.wav'},{label:'EK-70 / Small Taiko',wav:'audio/piece_085.wav'},{label:'EK-70 / Hyoshigi',wav:'audio/piece_086.wav'},{label:'EK-70 / Triangle',wav:'audio/piece_087.wav'},{label:'EK-70 / Cymbal',wav:'audio/piece_088.wav'},{label:'CX-30 / Bass Drum',wav:'audio/piece_089.wav'},{label:'CX-30 / Snare Drum',wav:'audio/piece_090.wav'},{label:'CX-30 / Claves',wav:'audio/piece_091.wav'},{label:'CX-30 / Low Conga',wav:'audio/piece_092.wav'},{label:'CX-30 / High Conga',wav:'audio/piece_093.wav'},{label:'CX-30 / Cymbal',wav:'audio/piece_094.wav'},{label:'CX-30 / Hi-Hat',wav:'audio/piece_095.wav'},{label:'VZ-1 / Po',wav:'audio/piece_096.wav'},{label:'VZ-1 / Pi',wav:'audio/piece_097.wav'},{label:'VZ-1 / Sha',wav:'audio/piece_098.wav'},{label:'MK-1R / Bass Drum',wav:'audio/piece_099.wav'},{label:'MK-1R / Block',wav:'audio/piece_100.wav'},{label:'MK-1R / Bongo I',wav:'audio/piece_101.wav'},{label:'MK-1R / Clave',wav:'audio/piece_102.wav'},{label:'MK-1R / Bongo II',wav:'audio/piece_103.wav'},{label:'MK-1R / Castanet',wav:'audio/piece_104.wav'}];

const seq=document.getElementById('sequencer');
const tracks=[];
for(let r=0;r<16;r++){
  const row=document.createElement('div');row.className='row';
  const sel=document.createElement('select');
  pieces.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p.label;sel.appendChild(o);});
  sel.value=Math.min(r,pieces.length-1);row.appendChild(sel);
  const steps=[];
  for(let s=0;s<16;s++){
    const b=document.createElement('button');b.className='step';b.textContent='ﾂｷ';b.dataset.on='0';
    b.onclick=()=>{b.dataset.on=b.dataset.on==='1'?'0':'1';b.classList.toggle('on',b.dataset.on==='1');};
    row.appendChild(b);steps.push(b);
  }
  seq.appendChild(row);tracks.push({sel,steps});
}
let ctx=null,buffers=new Map(),timer=null,step=0,nextTime=0;
async function audioBuffer(url){if(buffers.has(url))return buffers.get(url);const ab=await fetch(url).then(r=>r.arrayBuffer());const buf=await ctx.decodeAudioData(ab);buffers.set(url,buf);return buf;}
async function triggerTrack(track,when){const p=pieces[Number(track.sel.value)];const buf=await audioBuffer(p.wav);const src=ctx.createBufferSource();src.buffer=buf;const gain=ctx.createGain();gain.gain.value=0.7;src.connect(gain).connect(ctx.destination);src.start(Math.max(when,ctx.currentTime));}
function clearHead(){tracks.forEach(t=>t.steps.forEach(b=>b.classList.remove('playhead')));}
async function scheduler(){const bpm=Math.max(40,Math.min(300,Number(document.getElementById('bpm').value)||120));const dur=60/bpm/4;while(nextTime<ctx.currentTime+0.10){clearHead();tracks.forEach(t=>t.steps[step].classList.add('playhead'));tracks.forEach(t=>{if(t.steps[step].dataset.on==='1')triggerTrack(t,nextTime);});step=(step+1)%16;nextTime+=dur;}}
document.getElementById('seqPlay').onclick=async()=>{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();if(timer)return;step=0;nextTime=ctx.currentTime+0.05;timer=setInterval(scheduler,25);scheduler();};
document.getElementById('seqStop').onclick=()=>{if(timer){clearInterval(timer);timer=null;}step=0;clearHead();};
</script></body></html>
