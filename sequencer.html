<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>JRMS 16-step Sequencer</title><style>:root{color-scheme:dark}body{font-family:system-ui,sans-serif;max-width:1120px;margin:28px auto;padding:0 18px;background:#111;color:#eee}a{color:#9cf}button,select,input{font:inherit}.nav{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}.nav a{padding:7px 10px;border:1px solid #444;text-decoration:none}.transport{display:flex;gap:8px;align-items:center;margin:14px 0}.seq{overflow-x:auto;border:1px solid #333;padding:10px}.row{display:grid;grid-template-columns:230px repeat(16,32px);gap:4px;align-items:center;margin:4px 0}.row select{width:225px;background:#222;color:#eee;border:1px solid #444}.step{width:32px;height:28px;border:1px solid #444;background:#222;color:#777;padding:0}.step.on{background:#ddd;color:#111}.step.playhead{outline:2px solid #f90}.head{font-size:11px;color:#888}</style></head><body>
<h1>JRMS 16 Track / 16 Step Sequencer</h1><p>Mono, fixed level. Each track can select any rendered JRMS Piece.</p>
<nav class='nav'><a href='index.html'>Back to Listening Catalog</a><a href='https://github.com/hugelton/JapaneseRhythmMachineSimCatalog'>Catalog repository</a></nav>
<div class='transport'><button id='seqPlay'>Play</button><button id='seqStop'>Stop</button><label>BPM <input id='bpm' type='number' min='40' max='300' value='120' style='width:70px'></label></div><div class='seq'><div class='row head'><span>Piece</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span><span>16</span></div><div id='sequencer'></div></div>
<script src='catalog-data.js'></script><script>
const seq=document.getElementById('sequencer');const tracks=[];for(let r=0;r<16;r++){const row=document.createElement('div');row.className='row';const sel=document.createElement('select');pieces.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p.label;sel.appendChild(o);});sel.value=Math.min(r,pieces.length-1);row.appendChild(sel);const steps=[];for(let s=0;s<16;s++){const b=document.createElement('button');b.className='step';b.textContent='·';b.dataset.on='0';b.onclick=()=>{b.dataset.on=b.dataset.on==='1'?'0':'1';b.classList.toggle('on',b.dataset.on==='1');};row.appendChild(b);steps.push(b);}seq.appendChild(row);tracks.push({sel,steps});}
let ctx=null,buffers=new Map(),timer=null,step=0,nextTime=0;async function audioBuffer(url){if(buffers.has(url))return buffers.get(url);const ab=await fetch(url).then(r=>r.arrayBuffer());const buf=await ctx.decodeAudioData(ab);buffers.set(url,buf);return buf;}async function triggerTrack(track,when){const p=pieces[Number(track.sel.value)];const buf=await audioBuffer(p.wav);const src=ctx.createBufferSource();src.buffer=buf;const gain=ctx.createGain();gain.gain.value=0.7;src.connect(gain).connect(ctx.destination);src.start(Math.max(when,ctx.currentTime));}function clearHead(){tracks.forEach(t=>t.steps.forEach(b=>b.classList.remove('playhead')));}async function scheduler(){const bpm=Math.max(40,Math.min(300,Number(document.getElementById('bpm').value)||120));const dur=60/bpm/4;while(nextTime<ctx.currentTime+0.10){clearHead();tracks.forEach(t=>t.steps[step].classList.add('playhead'));tracks.forEach(t=>{if(t.steps[step].dataset.on==='1')triggerTrack(t,nextTime);});step=(step+1)%16;nextTime+=dur;}}
document.getElementById('seqPlay').onclick=async()=>{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();if(timer)return;step=0;nextTime=ctx.currentTime+0.05;timer=setInterval(scheduler,25);scheduler();};document.getElementById('seqStop').onclick=()=>{if(timer){clearInterval(timer);timer=null;}step=0;clearHead();};
</script></body></html>
